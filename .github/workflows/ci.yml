name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  cpu-tests:
    name: CPU tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.12"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install CPU test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "torch>=2.8" --index-url https://download.pytorch.org/whl/cpu
          python -m pip install pytest ruff

      - name: Compile Python sources
        run: python -m compileall -q .

      - name: Check critical lint errors
        run: ruff check . --select E9,F63,F7,F82

      - name: Run CPU regression tests
        run: pytest -q tests
