[project]
name = "h3vae-pyopt"
version = "0.1.0"
description = "Optimized PyTorch/Triton MiniMax H3 video VAE runtime for ComfyUI."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "fishelegs" }]
dependencies = [
  "torch>=2.8",
  "triton",
  "safetensors",
]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX :: Linux",
  "Environment :: GPU :: NVIDIA CUDA",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]

[project.urls]
Repository = "https://github.com/fishelegs/ComfyUI-H3VAE-PyOpt"
Documentation = "https://github.com/fishelegs/ComfyUI-H3VAE-PyOpt#readme"
Issues = "https://github.com/fishelegs/ComfyUI-H3VAE-PyOpt/issues"

[tool.comfy]
PublisherId = "fishelegs"
DisplayName = "ComfyUI-H3VAE-PyOpt"
