 <title id="chart-title">INT8 encode: reuse norm output absmax</title>
 <desc id="chart-description">2026-10-02 paired experiment  |  768 × 1344 × 124  |  Tile 256 / staged batch 4  |  6 runs per variant. 3.87% lower full-encode latency vs four-stage pipeline baseline. INT8: four-stage pipeline: 9.506353 seconds; INT8: pipeline + norm absmax: 9.138146 seconds. Same-process ABBA / BAAB / ABBA; same weights, layouts and compile options; dynamic quantization included. 8 videos / 992 frames: bitwise-equal latents; one 124-frame video's RGB also rechecked exactly. Measured peak allocated memory increases by 0.60 MiB. Auto-enabled on SM120 only. Existing INT8 quality loss remains. Decoder GEMM candidates did not provide a stable improvement.</desc>
