 <title id="chart-title">FP16 decode: historical references + fusion profile</title>
 <desc id="chart-description">768 × 1344 × 124  |  Decoder tile 256  |  Independent experiments; dates and configurations differ. Latest opt-in FP16 fusion: 10.923 s  ·  decode_fusions=true / batch 8. ComfyUI default · Sep 18: 15.021000 seconds; ComfyUI --fast · Sep 18: 12.440000 seconds; TensorRT rebuilt · Sep 18: 11.966000 seconds; PyOpt v0.2.0 · Sep 22: 11.477000 seconds; PyOpt FP16 fusion · Sep 24: 10.923379 seconds. ComfyUI --fast uses FP16 accumulation; TensorRT uses a different software stack. Latest fusion: 2 warmups / 5 runs. Historical controls were not remeasured in that experiment. FP16 fusion source PSNR: 35.110 dB across 992 frames. FP16 encoder retained. No cross-experiment speedup ratio or combined encode/decode claim. BF16 is not validated.</desc>
