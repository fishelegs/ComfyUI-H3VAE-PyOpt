 <title id="chart-title">H3 VAE encode: fastest recorded configurations</title>
 <desc id="chart-description">768 × 1344 × 124  |  Tile 256  |  One configuration per implementation  |  Independent experiments. PyOpt INT8: 8.458 s  ·  Lowest recorded latency in this comparison. TensorRT rebuilt · FP16: 14.270000 seconds; ComfyUI --fast · FP16: 12.059000 seconds; PyOpt current best · INT8: 8.458108 seconds. PyOpt uses mixed INT8; references use FP16. ComfyUI --fast enables FP16 accumulation. ComfyUI 387f98a / TensorRT 11.2.1.2: 2026-09-18. PyOpt: 2026-10-02. Inputs, stacks and batches differ; historical references were not rerun. No paired speedup ratio claimed. Encode and decode winners use separate PyOpt modes; these times are not a combined pipeline result.</desc>
