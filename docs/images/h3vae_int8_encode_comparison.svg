 <title id="chart-title">INT8 encode: optimized full-video runtime</title>
 <desc id="chart-description">2026-10-02 paired experiment  |  768 × 1344 × 124  |  Tile 256 / staged batch 4  |  2 warmups / 5 runs. 19.32% lower latency vs previous INT8  ·  15.17% lower vs FP16. Previous INT8: 12.545198 seconds; FP16 paired control: 11.931490 seconds; INT8: tile change only: 11.278200 seconds; INT8: tile + quantization: 10.121342 seconds. Same inputs, weights and compiled INT8 graph; dynamic quantization included. 8 videos / 992 frames: optimized and previous INT8 latents + RGB are bitwise equal. Source PSNR: FP16 35.110 dB; old/new INT8 34.486 dB. Existing quantization loss remains. Encoder only. decode_fusions=false; do not add this to the fused decoder time.</desc>
